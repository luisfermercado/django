{% load blog_tags %}<article class="post-card">
  <div class="post-card__bar" style="background: {{ post|pillar_color }}"></div>
  <div class="post-card__body">
    <div class="tagline">{{ post.category }} · {{ post.get_pillar_display }}</div>
    <h3 class="post-card__title"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
    <p>{{ post.excerpt|truncatewords:32 }}</p>
    <div class="meta">
      <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"j M Y" }}</time>
      <span>{{ post.reading_minutes }} min de lectura</span>
    </div>
  </div>
</article>
